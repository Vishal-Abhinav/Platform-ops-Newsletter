<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320"
     width="1200" height="320" role="img"
     aria-label="Platform Ops — field notes from production, not slideware.
                 Written by Vishal Abhinav, published by Srivan Technologies.
                 21 issues, 685 topics across 45 categories,
                 362 commands documented.">
<style>
  .wm   { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
           font-weight: 700; letter-spacing: 6px; }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }

  /* The bars rise once, then breathe. A masthead that loops aggressively is a
     distraction on a page someone is trying to read. */
  .bar    { transform-origin: left center; animation: grow .9s cubic-bezier(.2,.7,.3,1) backwards; }
  @keyframes grow { from { transform: scaleX(0); opacity: 0; } }

  .seg    { transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.7,.3,1) .5s backwards; }

  .fade   { animation: fade .8s ease-out backwards; }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } }

  /* One pulse crossing the rule, echoing the two-paths diagram on the site. */
  .pulse  { animation: run 5.6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes run {
    0%   { transform: translateX(0);    opacity: 0; }
    6%   { opacity: 1; }
    80%  { opacity: 1; }
    92%, 100% { transform: translateX(1080px); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bar, .seg, .fade, .pulse { animation: none; }
    .pulse { opacity: 0; }
  }
</style>

<rect width="1200" height="320" fill="#08090c"/>

<!-- a faint grid, the same one the site's hero uses -->
<g stroke="rgba(255,255,255,.07)" stroke-width="1">
  <line x1="60" y1="0" x2="60" y2="320"/><line x1="120" y1="0" x2="120" y2="320"/><line x1="180" y1="0" x2="180" y2="320"/><line x1="240" y1="0" x2="240" y2="320"/><line x1="300" y1="0" x2="300" y2="320"/><line x1="360" y1="0" x2="360" y2="320"/><line x1="420" y1="0" x2="420" y2="320"/><line x1="480" y1="0" x2="480" y2="320"/><line x1="540" y1="0" x2="540" y2="320"/><line x1="600" y1="0" x2="600" y2="320"/><line x1="660" y1="0" x2="660" y2="320"/><line x1="720" y1="0" x2="720" y2="320"/><line x1="780" y1="0" x2="780" y2="320"/><line x1="840" y1="0" x2="840" y2="320"/><line x1="900" y1="0" x2="900" y2="320"/><line x1="960" y1="0" x2="960" y2="320"/><line x1="1020" y1="0" x2="1020" y2="320"/><line x1="1080" y1="0" x2="1080" y2="320"/><line x1="1140" y1="0" x2="1140" y2="320"/>
  <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="300" x2="1200" y2="300"/>
</g>

<rect class="bar" x="60" y="85.0" width="18.900000000000002" height="5.4" rx="1.35" fill="#e53935" style="animation-delay:0.0s"/><rect class="bar" x="60" y="75.55" width="28.35" height="5.4" rx="1.35" fill="#e53935" style="animation-delay:0.18s"/><rect class="bar" x="60" y="66.1" width="37.800000000000004" height="5.4" rx="1.35" fill="#e53935" style="animation-delay:0.36s"/>

<text class="wm fade" x="60" y="152" font-size="62" fill="#f2f0eb"
      style="animation-delay:.15s">PLATFORM OPS</text>

<text class="mono fade" x="63" y="186" font-size="15" fill="#8b8780"
