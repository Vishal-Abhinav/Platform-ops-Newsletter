  FIELD NOTES FROM PRODUCTION, NOT SLIDEWARE
</text>

<text class="mono fade" x="63" y="216" font-size="13" fill="#00c2d4"
      letter-spacing="1.6" style="animation-delay:.38s">
  VISHAL ABHINAV  ·  SRIVAN TECHNOLOGIES
</text>

<!-- the rule, and the pulse that crosses it -->
<line x1="60" y1="244" x2="1140" y2="244" stroke="rgba(255,255,255,.13)" stroke-width="1"/>
<circle class="pulse" cx="60" cy="244" r="3.5" fill="#e53935"/>

<!-- coverage, to scale, from taxonomy.py -->
<rect class="seg s-live" x="60" y="262" width="242.8" height="7" fill="#e53935"/><rect class="seg s-pipe" x="302.8029197080292" y="262" width="233.3" height="7" fill="#f59e0b"/><rect class="seg s-plan" x="536.1459854014598" y="262" width="603.9" height="7" fill="#3a3f4a"/>

<text class="mono" x="60" y="292" font-size="11.5" fill="#8b8780" letter-spacing="1.3">
