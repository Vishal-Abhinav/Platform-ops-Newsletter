name: build → verify → deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Build the site
        run: bash tools/build.sh

      - name: Authentication tests
        run: node tools/test_auth.mjs

      - name: Refuse to deploy an empty build
        run: |
          count=$(find dist -name '*.html' | wc -l)
          echo "dist/ contains $count html files"
          if [ "$count" -lt 500 ]; then
            echo "::error::dist/ holds $count html files - expected ~880. Refusing to deploy."
            exit 1
          fi

      - name: Install render-test dependencies
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Render tests
        run: python3 tools/test_render.py dist

      - name: Reduced-motion tests
        run: python3 tools/test_motion.py dist

      - name: Require authentication deployment secrets
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          OAUTH_GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
          OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          missing=0
          for name in D1_DATABASE_ID OAUTH_GITHUB_CLIENT_ID OAUTH_GITHUB_CLIENT_SECRET ADMIN_EMAILS RESEND_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required repository secret $name is missing"
              missing=1
            fi
          done
          exit "$missing"

      - name: Sync authentication runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OAUTH_GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
          OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM }}
          NEWSLETTER_BATCH_LIMIT: ${{ secrets.NEWSLETTER_BATCH_LIMIT }}
        run: |
          jq -n \
            --arg client_id "$OAUTH_GITHUB_CLIENT_ID" \
            --arg client_secret "$OAUTH_GITHUB_CLIENT_SECRET" \
            --arg google_client_id "$OAUTH_GOOGLE_CLIENT_ID" \
            --arg google_client_secret "$OAUTH_GOOGLE_CLIENT_SECRET" \
            --arg admins "$ADMIN_EMAILS" \
            --arg resend "$RESEND_API_KEY" \
            --arg newsletter_from "$NEWSLETTER_FROM" \
            --arg newsletter_batch "$NEWSLETTER_BATCH_LIMIT" \
            '{OAUTH_GITHUB_CLIENT_ID:$client_id,OAUTH_GITHUB_CLIENT_SECRET:$client_secret,ADMIN_EMAILS:$admins,RESEND_API_KEY:$resend}
             + (if $google_client_id != "" and $google_client_secret != "" then
                  {OAUTH_GOOGLE_CLIENT_ID:$google_client_id,OAUTH_GOOGLE_CLIENT_SECRET:$google_client_secret}
                else {} end)
             + (if $newsletter_from != "" then {NEWSLETTER_FROM:$newsletter_from} else {} end)
             + (if $newsletter_batch != "" then {NEWSLETTER_BATCH_LIMIT:$newsletter_batch} else {} end)' \
            | npx --yes wrangler@4.134.0 secret bulk

      - name: Configure production D1 binding
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: python3 tools/configure_wrangler.py wrangler.jsonc wrangler.deploy.jsonc

      - name: Apply authentication database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.134.0 d1 migrations apply platform-ops-auth --remote --config wrangler.deploy.jsonc

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.134.0 deploy --config wrangler.deploy.jsonc

      # Auth routing is covered by tools/test_auth.mjs. Do not probe the public
      # hostname from GitHub-hosted runners: Cloudflare Bot Fight Mode issues a
      # managed challenge to their shared IPs before the Worker receives it.
