name: build → verify → deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Build the site
        run: bash tools/build.sh

      - name: Refuse to deploy an empty build
        run: |
          count=$(find dist -name '*.html' | wc -l)
          echo "dist/ contains $count html files"
          if [ "$count" -lt 500 ]; then
            echo "::error::dist/ holds $count html files - expected ~880. Refusing to deploy."
            exit 1
          fi

      - name: Install render-test dependencies
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Render tests
        run: python3 tools/test_render.py dist

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.134.0 deploy

      - name: Reduced-motion tests
        run: python3 tools/test_motion.py dist
